services:
  - type: web
    name: domus-luciferis
    runtime: node
    plan: starter
    buildCommand: npm install && npm run check && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: ADMIN_TOKEN
        sync: false
    disk:
      name: domus-luciferis-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
